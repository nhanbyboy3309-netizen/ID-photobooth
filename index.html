
<!DOCTYPE html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ID Photo Booth Pro</title>
    <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
            colors: {
              brand: {
                50: 'rgb(var(--brand-50) / <alpha-value>)',
                100: 'rgb(var(--brand-100) / <alpha-value>)',
                200: 'rgb(var(--brand-200) / <alpha-value>)',
                300: 'rgb(59 130 246 / 0.5)', 
                400: 'rgb(59 130 246 / 0.7)',
                500: 'rgb(var(--brand-500) / <alpha-value>)',
                600: 'rgb(var(--brand-600) / <alpha-value>)',
                700: 'rgb(var(--brand-700) / <alpha-value>)',
                800: 'rgb(30 64 175 / <alpha-value>)',
                900: 'rgb(30 58 138 / <alpha-value>)',
              },
              dark: {
                800: '#1e1e2e',
                900: '#11111b',
                950: '#0b0b12',
              }
            },
            screens: {
              'print': {'raw': 'print'},
            },
            animation: {
              'fadeIn': 'fadeIn 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-50: 239 246 255;
        --brand-100: 219 234 254;
        --brand-200: 191 219 254;
        --brand-500: 59 130 246;
        --brand-600: 37 99 235;
        --brand-700: 29 78 216;
      }

      html {
        scroll-behavior: smooth;
      }

      /* Premium easing curve applied to every Tailwind transition utility already used
         throughout the app, without needing to touch each component. */
      [class*="transition"] {
        transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      ::selection {
        background: rgb(var(--brand-500) / 0.25);
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Modern Range Slider */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        height: 20px;
        cursor: pointer;
        margin: 5px 0;
      }
      
      input[type=range]:focus {
        outline: none;
      }

      /* Slider Track */
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: #e2e8f0;
        border-radius: 999px;
        transition: all 0.2s;
      }
      .dark input[type=range]::-webkit-slider-runnable-track {
        background: #334155;
      }

      /* Slider Thumb */
      input[type=range]::-webkit-slider-thumb {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: rgb(var(--brand-600));
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -7px;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 1), 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.1s;
      }
      
      .dark input[type=range]::-webkit-slider-thumb {
        box-shadow: 0 0 0 4px rgba(30, 41, 59, 1), 0 4px 6px rgba(0,0,0,0.3);
      }

      input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.1);
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 20px);
      }
      
      /* Print Styles */
      #print-mount {
        display: none;
      }
      
      @media print {
        @page {
          size: auto; 
          margin: 0;
        }
        html, body {
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root {
          display: none !important;
          height: 0 !important;
          overflow: hidden !important;
        }
        #print-mount {
          display: block !important;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 9999;
          background: white;
        }
        .sheet-page {
          page-break-after: always;
          break-after: page;
          width: 130mm;
          height: auto;
          overflow: hidden;
          position: relative;
        }
        .sheet-page:last-child {
          page-break-after: avoid;
          break-after: auto;
        }
        .sheet-page img {
          width: 100% !important;
          height: auto !important;
          display: block;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.6.0/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 antialiased h-full dark:bg-dark-950 dark:text-gray-100 transition-colors duration-300">
    <div id="root" class="h-full"></div>
    <div id="print-mount"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
